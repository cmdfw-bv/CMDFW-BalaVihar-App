<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale — base 4" subtitle="Compose padding & gaps from the scale" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--sans); padding: 22px 24px; }
  .row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--primary); border-radius: 3px; width: 26px; }
  .lbl { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-align: center; }
  .lbl b { color: var(--ink); font-weight: 600; display: block; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="lbl"><b>1</b>4px</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="lbl"><b>2</b>8px</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="lbl"><b>3</b>12px</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="lbl"><b>4</b>16px</div></div>
    <div class="item"><div class="bar" style="height:20px"></div><div class="lbl"><b>5</b>20px</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="lbl"><b>6</b>24px</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="lbl"><b>8</b>32px</div></div>
    <div class="item"><div class="bar" style="height:40px"></div><div class="lbl"><b>10</b>40px</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="lbl"><b>12</b>48px</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="lbl"><b>16</b>64px</div></div>
  </div>
</body>
</html>
