<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — Paper, cream & wells" subtitle="The warm-paper foundation layers" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--sans); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: var(--rad); overflow: hidden; border: 1px solid var(--line); }
  .chip { height: 76px; }
  .meta { background: var(--surface); padding: 9px 11px; border-top: 1px solid var(--line); }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .val { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="meta"><div class="name">Page canvas</div><div class="val">#f7f1e6 · --bg</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--bg-cream)"></div><div class="meta"><div class="name">Cream well</div><div class="val">#fbf6eb · --bg-cream</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="meta"><div class="name">Surface · card</div><div class="val">#fffaf0 · --surface</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-alt)"></div><div class="meta"><div class="name">Surface-alt</div><div class="val">#f1e8d4 · --surface-alt</div></div></div>
  </div>
</body>
</html>
