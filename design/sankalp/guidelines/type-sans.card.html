<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--sans); padding: 22px 24px; color: var(--ink-2); }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); }
  .lede { font-size: 18px; line-height: 1.55; color: var(--ink-2); margin: 10px 0 0; max-width: 56ch; }
  .body { font-size: 15px; line-height: 1.6; color: var(--ink-3); margin: 12px 0 0; max-width: 60ch; }
  .meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); margin-top: 16px; }
</style>
</head>
<body>
  <p class="eyebrow">Stay in the loop</p>
  <p class="lede">Register for the season's gatherings at Chinmaya Mission.</p>
  <p class="body">Every gathering is prepared with care — from seating and prasad to the sacred protocols that hold the room.</p>
  <p class="meta">Mukta · 300 / 400 / 500 / 600 / 700 · Latin + Devanagari · --sans</p>
</body>
</html>
