<!-- @dsCard group="Type" viewport="700x260" name="Type scale & hierarchy" subtitle="Display → eyebrow, with the family for each step" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--sans); padding: 22px 24px; color: var(--ink); }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); width: 130px; flex-shrink: 0; }
  .s1 { font-family: var(--serif); font-size: 46px; font-weight: 400; line-height: 1.02; letter-spacing: .005em; }
  .s2 { font-family: var(--serif); font-size: 30px; font-weight: 400; letter-spacing: .005em; }
  .s3 { font-family: var(--serif); font-size: 22px; font-weight: 400; letter-spacing: .005em; }
  .s4 { font-size: 18px; }
  .s5 { font-size: 15px; color: var(--ink-2); }
  .s6 { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--primary); }
</style>
</head>
<body>
  <div class="line"><span class="tag">Display · serif</span><span class="s1">Hari Om</span></div>
  <div class="line"><span class="tag">H2 · serif</span><span class="s2">All events</span></div>
  <div class="line"><span class="tag">H3 · serif</span><span class="s3">Bala Vihar Connect</span></div>
  <div class="line"><span class="tag">Lead · sans</span><span class="s4">Register for the season's gatherings.</span></div>
  <div class="line"><span class="tag">Body · sans</span><span class="s5">Prepared with care — seating, prasad, protocol.</span></div>
  <div class="line"><span class="tag">Eyebrow · sans</span><span class="s6">Registration open</span></div>
</body>
</html>
