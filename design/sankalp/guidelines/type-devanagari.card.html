<!-- @dsCard group="Type" viewport="700x160" name="Devanagari & OM — Mukta" subtitle="Sanskrit, festival names, the OM glyph" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--deva); padding: 22px 24px; color: var(--ink); }
  .row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .deva { font-size: 34px; font-weight: 500; color: var(--indigo); }
  .deva small { display: block; font-family: var(--serif); font-style: normal; font-size: 15px; color: var(--ink-3); margin-top: 4px; letter-spacing: .01em; }
  .om { font-size: 64px; color: var(--primary); line-height: 1; }
  .meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); margin-top: 18px; }
</style>
</head>
<body>
  <div class="row">
    <span class="om">ॐ</span>
    <span class="deva">हनुमान चालीसा हवन<small>Hanuman Chalisa Havan</small></span>
    <span class="deva">पितृ दिवस<small>Father's Day</small></span>
  </div>
  <p class="meta">Mukta covers Devanagari + Latin · --deva &nbsp;·&nbsp; OM mark also ships as a logo png</p>
</body>
</html>
