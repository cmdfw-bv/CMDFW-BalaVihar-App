<!-- @dsCard group="Type" viewport="700x170" name="Mono — JetBrains Mono" subtitle="Tabular numerics, IDs, scopes, timestamps" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--mono); padding: 22px 24px; color: var(--ink); }
  .rows { display: flex; flex-direction: column; gap: 9px; font-variant-numeric: tabular-nums; }
  .r { display: flex; gap: 20px; font-size: 15px; letter-spacing: .04em; }
  .r span:first-child { color: var(--ink-4); width: 150px; }
  .r b { color: var(--primary); font-weight: 500; }
  .meta { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); margin-top: 18px; }
</style>
</head>
<body>
  <div class="rows">
    <div class="r"><span>REG ID</span><b>FD26-7K2QX9</b></div>
    <div class="r"><span>ATTENDANCE</span><b>94.2%</b> &nbsp;·&nbsp; 47/50 marked</div>
    <div class="r"><span>SCOPE</span>TEACHER · JR·A &nbsp;·&nbsp; 2026-06-14 09:00</div>
  </div>
  <p class="meta">JetBrains Mono · 400 / 500 / 600 · tabular-nums · --mono</p>
</body>
</html>
