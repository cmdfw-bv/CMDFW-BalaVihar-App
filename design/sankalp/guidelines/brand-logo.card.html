<!-- @dsCard group="Brand" viewport="700x200" name="Logo — OM mark & lockups" subtitle="The saffron OM mark on light, cream and indigo" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--sans); padding: 22px 24px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: stretch; }
  .lock { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-radius: var(--rad-lg); border: 1px solid var(--line); }
  .lock img { height: 44px; width: auto; display: block; }
  .wm { display: flex; flex-direction: column; line-height: 1.1; }
  .wm strong { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--ink); }
  .wm span { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .on-light { background: var(--surface); }
  .on-cream { background: var(--bg-cream); }
  .on-dark { background: var(--indigo); border-color: var(--indigo-2); }
  .on-dark strong { color: var(--on-dark); }
  .on-dark span { color: rgba(251,243,223,.7); }
</style>
</head>
<body>
  <div class="row">
    <div class="lock on-light"><img src="../assets/chinmaya-om.png" alt="OM" /><div class="wm"><strong>Chinmaya Mission DFW</strong><span>Events &amp; Satsangs</span></div></div>
    <div class="lock on-cream"><img src="../assets/chinmaya-om.png" alt="OM" /></div>
    <div class="lock on-dark"><img src="../assets/chinmaya-om.png" alt="OM" /><div class="wm"><strong>Chinmaya Mission DFW</strong><span>est. 1982</span></div></div>
  </div>
</body>
</html>
