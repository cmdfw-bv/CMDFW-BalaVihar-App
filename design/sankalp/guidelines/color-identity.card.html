<!-- @dsCard group="Colors" viewport="700x150" name="Identity — Indigo & Gold" subtitle="Devotional grounds and festival highlight (never CTAs)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--bg); font-family: var(--sans); padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .sw { border-radius: var(--rad); overflow: hidden; border: 1px solid var(--line); }
  .chip { height: 76px; }
  .meta { background: var(--surface); padding: 9px 11px; }
  .name { font-size: 12px; font-weight: 600; color: var(--ink); }
  .val { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--indigo)"></div><div class="meta"><div class="name">Indigo</div><div class="val">#2d2056</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-2)"></div><div class="meta"><div class="name">Indigo-2</div><div class="val">#1a1238</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="meta"><div class="name">Gold</div><div class="val">#b8893f</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--gold-2)"></div><div class="meta"><div class="name">Gold-2</div><div class="val">#8a6320</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo); display:flex; align-items:center; justify-content:center; color:var(--gold-light); font-family:var(--serif); font-style:italic; font-size:20px;">gold on dark</div><div class="meta"><div class="name">Gold-light</div><div class="val">#f6c98a</div></div></div>
  </div>
</body>
</html>
