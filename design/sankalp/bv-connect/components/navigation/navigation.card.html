<!doctype html>

<head>

<style>
  body { margin: 0; background: var(--app-canvas); font-family: var(--sans); padding: 18px; }
  .wrap { max-width: 404px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 12px; background: var(--app-surface); border: 1px solid var(--line); border-radius: var(--app-rad-card); box-shadow: var(--app-shadow-card); padding: 12px 14px; }

<body>
<div class="wrap">
  <div class="bar"><span class="t">Register</span><span id="sw"></span></div>
  <p class="hint">Tap the role pill to open the switch sheet — switching re-scopes every screen (own children → class → session → org).</p>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<script type="text/babel">
  const { PersonaSwitcher } = window.ChinmayaMissionDesignSystem_52eae1;
  function Demo() {
    const [role, setRole] = React.useState("teacher");
    return (
      <PersonaSwitcher activeId={role} onChange={setRole} roles={[
        { id: "teacher", name: "Teacher", role: "teacher", scope: "JR·A · Brampton" },
        { id: "coordinator", name: "Coordinator", role: "coordinator", scope: "Session · Brampton" },
        { id: "bv", name: "BV Coordinator", role: "bv", scope: "Org rollup" },
        { id: "parent", name: "Parent", role: "parent", scope: "2 children" },
      ]} />
    );
  }
  ReactDOM.createRoot(document.getElementById("sw")).render(<Demo />);
</script>
